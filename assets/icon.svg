<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB16E"/>
      <stop offset="1" stop-color="#6E9152"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F4EEDF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 冰箱本体 -->
  <g>
    <rect x="128" y="78" width="256" height="348" rx="42" fill="#3A3230"/>
    <rect x="140" y="90" width="232" height="324" rx="34" fill="url(#door)"/>

    <!-- 门缝 -->
    <rect x="140" y="196" width="232" height="13" fill="#3A3230"/>

    <!-- 上门把手 -->
    <rect x="341" y="124" width="14" height="50" rx="7" fill="#E4674B"/>
    <!-- 下门把手 -->
    <rect x="341" y="232" width="14" height="76" rx="7" fill="#E4674B"/>

    <!-- 脸：眼睛 -->
    <circle cx="209" cy="274" r="14" fill="#3A3230"/>
    <circle cx="281" cy="274" r="14" fill="#3A3230"/>
    <circle cx="214" cy="269" r="5" fill="#FFFDF7"/>
    <circle cx="286" cy="269" r="5" fill="#FFFDF7"/>
    <!-- 腮红 -->
    <ellipse cx="180" cy="301" rx="19" ry="12" fill="#F2A99A" opacity=".85"/>
    <ellipse cx="310" cy="301" rx="19" ry="12" fill="#F2A99A" opacity=".85"/>
    <!-- 微笑 -->
    <path d="M220 306 Q245 330 270 306" stroke="#3A3230" stroke-width="13" stroke-linecap="round" fill="none"/>

    <!-- 上门：小磁贴（叶子） -->
    <g transform="translate(196 122) rotate(-14)">
      <path d="M0 26 C0 8 16 0 34 0 C34 18 20 30 0 26 Z" fill="#7A9E5E"/>
      <path d="M4 24 L28 6" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- 上门：小番茄磁贴 -->
    <circle cx="266" cy="150" r="17" fill="#E4674B"/>
    <path d="M266 133 q7 -8 14 -4" stroke="#7A9E5E" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="260" cy="145" r="5" fill="#FFFFFF" opacity=".55"/>
  </g>

  <!-- 底部小脚 -->
  <rect x="160" y="426" width="34" height="20" rx="9" fill="#3A3230"/>
  <rect x="318" y="426" width="34" height="20" rx="9" fill="#3A3230"/>
</svg>
